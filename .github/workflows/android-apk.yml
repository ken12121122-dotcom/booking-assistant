name: Build Android APK

on:
  push:
    branches: [android-mvp]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install stable test signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          echo '' | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Prepare update asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BookingAssistant-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: booking-assistant-debug-apk
          path: BookingAssistant-latest.apk

      - name: Publish latest update APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest BookingAssistant-latest.apk --clobber
          else
            gh release create android-latest BookingAssistant-latest.apk --target "$GITHUB_SHA" --title "Booking Assistant Android Latest" --notes "Rolling test release for in-app updates."
          fi
