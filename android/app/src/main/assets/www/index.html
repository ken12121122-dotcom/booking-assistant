<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Booking Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section id="setup" class="panel hidden">
      <p class="eyebrow">首次交機</p>
      <h1>Booking Assistant</h1>
      <p class="muted">先建立店家資料。完成後即可使用本機客戶、課程與簽到功能。</p>

      <label>店家名稱</label>
      <input id="businessName" placeholder="例如：ABC 教室" />

      <label>管理員 PIN</label>
      <input id="adminPin" type="password" inputmode="numeric" minlength="4" placeholder="至少 4 碼" />

      <button id="startSetup">開始初始化</button>
      <p id="setupStatus" class="status"></p>
    </section>

    <section id="admin" class="panel hidden">
      <div class="topbar">
        <div>
          <p class="eyebrow">本機後台</p>
          <h1 id="businessTitle">Booking Assistant</h1>
        </div>
        <span id="version" class="badge"></span>
      </div>

      <div class="updateBar">
        <div>
          <strong>系統更新</strong>
          <small id="updateStatus">可直接由 App 下載最新 APK。</small>
        </div>
        <button id="updateApp" class="compact">更新</button>
      </div>

      <div class="grid">
        <article class="card"><strong>今日課表</strong><span id="todayClassCount">0</span><small>依今日日期計算</small></article>
        <article class="card"><strong>客戶</strong><span id="customerCount">0</span><small>本機名單</small></article>
        <article class="card"><strong>簽到</strong><span id="checkinCount">0</span><small>今日簽到</small></article>
      </div>

      <nav class="tabs">
        <button data-tab="customers" class="tab active">客戶</button>
        <button data-tab="classes" class="tab">課表</button>
        <button data-tab="checkins" class="tab">簽到</button>
      </nav>

      <section id="customers" class="workspace">
        <h2>客戶管理</h2>
        <div class="formRow">
          <input id="customerName" placeholder="姓名" />
          <input id="customerPhone" placeholder="電話" inputmode="tel" />
          <button id="addCustomer">新增客戶</button>
        </div>
        <div id="customerList" class="list"></div>
      </section>

      <section id="classes" class="workspace hidden">
        <h2>課表管理</h2>
        <div class="formRow">
          <input id="className" placeholder="課程名稱" />
          <input id="classTime" type="datetime-local" />
          <button id="addClass">新增課程</button>
        </div>
        <div id="classList" class="list"></div>
      </section>

      <section id="checkins" class="workspace hidden">
        <h2>快速簽到</h2>
        <p class="muted">選擇客戶後立即記錄目前時間。</p>
        <div class="formRow two">
          <select id="checkinCustomer"></select>
          <button id="addCheckin">立即簽到</button>
        </div>
        <div id="checkinList" class="list"></div>
      </section>

      <div class="actions">
        <button class="secondary" id="resetSetup">重設交機精靈</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
